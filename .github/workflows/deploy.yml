# Builds the Vite app in app/ and deploys it to GitHub Pages together with the
# repository-root assets (question packs, data files, standalone pages).
# Pages source must be set to "GitHub Actions" in the repository settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Assemble site
        run: |
          mkdir -p site
          # Built app (index.html + hashed assets)
          cp -r app/dist/. site/
          # Root assets the app and the standalone pages rely on
          cp -r packs site/packs
          cp config.js pack-index.js help.js qhelp.js qorder.js qidea.js calc.js ws-data.js exam-data.js slides-data.js ads.js sw.js site/
          cp manifest.webmanifest *.png *.jpg theme.css site/ 2>/dev/null || true
          cp episode1.mp4 site/ 2>/dev/null || true
          for f in worksheets pworksheets slides recommend feedback daily exam analytics welcome; do cp "$f.html" site/; done
          [ -d slides ] && cp -r slides site/slides || true
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
