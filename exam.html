<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>A+ Exam Practice</title><style>
:root{--p:#0f766e;--bg:#f8fafc;--ink:#1e293b;--mut:#64748b;--ac:#fb923c;--card:#fff;--ln:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--ink:#e2e8f0;--mut:#94a3b8;--card:#1e293b;--ln:#334155;--p:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f766e;color:#fff;padding:14px 16px}header b{font-size:18px}header b span{color:#fbbf24}header small{display:block;opacity:.85}
nav{display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0}
nav button{flex:1;padding:9px;border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:8px;font-weight:600;cursor:pointer}nav button.on{background:#0f766e;color:#fff;border-color:#0f766e}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}.filters label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
.pill{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;margin:0 4px 4px 0;cursor:pointer}.pill.on{background:var(--ac);border-color:var(--ac);color:#1e293b;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;font-size:14px}
.q,.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}.qh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.n{background:#0f766e;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.chip{font-size:11px;border:1px solid var(--ln);border-radius:10px;padding:1px 8px;color:var(--mut)}.g9,.g8{background:#fb923c33}.mk{margin-left:auto;font-size:12px;color:var(--mut)}
.sol{display:none;margin-top:8px;padding:8px 10px;border-left:3px solid #0f766e;background:#0f766e14;border-radius:4px;font-size:14px}.sol.show{display:block}
button.sec,button.pri{border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}button.sec{border:1px solid var(--ln);background:transparent;color:var(--ink)}button.pri{border:0;background:#0f766e;color:#fff}
.we{background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}.self{margin:-4px 0 10px;font-size:13px;text-align:right}.self input{width:56px}
.paper{background:#fff;color:#111;border:1px solid #cbd5e1;box-shadow:0 2px 10px #0002;padding:18px 18px 8px;font-family:Arial,Helvetica,sans-serif}
.cover{border:2px solid #111;padding:14px;margin-bottom:18px}.brandr{font-weight:800;letter-spacing:1px;color:#0f766e}.brandr span{color:#fb923c}.cover h1{font-size:20px;margin:8px 0 2px}.cover h2{font-size:15px;margin:0 0 10px;font-weight:600}.cover h3{font-size:13px;margin:10px 0 2px}.cover ul{margin:0;padding-left:18px;font-size:13px}.cand{font-size:13px;margin:10px 0}.info{font-size:14px}
.pq{display:flex;gap:10px;padding:12px 0;border-top:1px solid #111;break-inside:avoid;color:#111}.pqn{font-weight:700;width:22px;flex:none;font-size:15px}.pqb{flex:1;font-size:15px;line-height:1.5}.stem{margin:0 0 6px}
.part{display:flex;gap:8px;margin:6px 0}.pl{width:26px;flex:none}.al{border-bottom:1px dotted #555;height:26px}.mkr{text-align:right;font-weight:600;margin-top:2px}.tot{text-align:right;font-size:12px;font-weight:700;margin-top:6px}
.tags{margin-top:4px}.end{text-align:center;font-weight:700;border-top:2px solid #111;padding:10px;margin-top:6px;font-size:13px}.bar[stick]{position:sticky;top:56px;background:var(--bg);padding:6px 0;z-index:2}
@media print{.paper{border:0;box-shadow:none;padding:0}.pq{border-top:1px solid #000}}
@media print{header,nav,.filters,button{display:none!important}.sol{display:block!important}.q{break-inside:avoid;border:0;border-bottom:1px solid #ccc}body{background:#fff;color:#000}}
</style></head><body><header><b>A<span>+</span> Exam Practice</b><small>Edexcel IGCSE Maths A (4MA1) · Higher · Original exam-style questions (beta: more topics coming) · <a href="index.html" style="color:#fff">← A+ Maths Hub</a></small></header>
<nav><button data-t=practice class=on>Practice</button><button data-t=mock>Mock exam</button><button data-t=lessons>Lessons</button></nav><main id=v></main>
<script src="exam-data.js"></script><script>const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/\^(-?\d+|[a-zA-Z](?![a-zA-Z0-9]))/g,(m,a)=>'<sup>'+a+'</sup>');
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));let topic='All',grade='All',tab='practice',mock=null;
function tabs(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
function parts(q){const t=q.q;const m=t.split(/\s*\((?=[a-d]\))/);if(m.length<2)return {stem:t,ps:[]};const stem=m[0].trim();const ps=m.slice(1).map(x=>{const l=x[0];return [l,x.slice(2).trim()]});return {stem,ps}}
function lines(n){return Array.from({length:n},()=>'<div class=al></div>').join('')}
function qHtml(q,i,withSol,mode){const p=parts(q);const body=(p.stem?`<p class=stem>${fmt(p.stem)}</p>`:'')+p.ps.map(x=>`<div class=part><span class=pl>(${x[0]})</span><div>${fmt(x[1])}${lines(2)}</div></div>`).join('');
return `<div class=pq><div class=pqn>${i}</div><div class=pqb>${p.ps.length?'':`<p class=stem>${fmt(q.q)}</p>`}${p.ps.length?body:''}${p.ps.length?'':lines(Math.max(2,q.m))+`<div class=mkr>(${q.m})</div>`}<div class=tot>(Total for Question ${i} is ${q.m} mark${q.m>1?'s':''})</div>${mode==='practice'?`<div class=tags><span class=chip>${q.t}</span><span class="chip g${q.g}">Grade ${q.g}</span></div>`:''}${withSol?`<button class=sec onclick="this.nextElementSibling.classList.toggle('show')">Show mark scheme</button><div class=sol><b>Mark scheme</b><br>${fmt(q.sol)}<br><b>Answer:</b> ${fmt(q.ans)}</div>`:''}</div></div>`}
function practice(){const L=Q.filter(q=>(topic==='All'||q.t===topic)&&(grade==='All'||q.g==grade));const tot=L.reduce((a,q)=>a+q.m,0);
return `<div class=filters><div><label>Topic</label>${['All',...new Set(Q.map(q=>q.t))].map(t=>`<button class="pill ${t===topic?'on':''}" onclick="topic='${t}';render()">${t}</button>`).join('')}</div><div><label>Grade</label>${['All',5,6,7,8,9].map(g=>`<button class="pill ${g==grade?'on':''}" onclick="grade='${g}';render()">${g}</button>`).join('')}</div></div><div class=bar><b>${L.length}</b> questions · <b>${tot}</b> marks <button class=pri onclick="window.print()">Print this set</button></div>${L.map((q,i)=>qHtml(q,i+1,true,'practice')).join('')||'<p>No questions match. Try another grade.</p>'}`}
function lessons(){return Object.entries(LESSONS).map(([t,l])=>`<section class=card><h2>${t}</h2><p>${fmt(l.intro)}</p><h3>Key rules</h3><ul>${l.rules.map(r=>`<li>${fmt(r)}</li>`).join('')}</ul><h3>Worked examples</h3>${l.ex.map(e=>`<div class=we><b>${fmt(e[0])}</b><br>${fmt(e[1])}</div>`).join('')}<button class=pri onclick="topic='${t}';grade='All';tabs('practice')">Practise ${t}</button></section>`).join('')}
function mockView(){const L=MOCK.map(id=>byId[id]);const tot=L.reduce((a,q)=>a+q.m,0);
if(!mock)return `<section class=card><h2>Mini mock exam</h2><p>${L.length} questions · ${tot} marks · 48 minutes (Edexcel pace: about 1.2 minutes per mark). Questions get harder as you go. Write your answers on paper, then mark yourself with the mark scheme.</p><button class=pri onclick="startMock()">Start the mock</button></section>`;
const mins=Math.max(0,Math.floor(mock.left/60)),secs=String(Math.max(0,mock.left%60)).padStart(2,'0');
if(!mock.done)return `<div class=bar stick><b>Time left: ${mins}:${secs}</b><button class=pri onclick="finishMock()">Finish and mark</button></div><div class=paper>${cover(tot)}${L.map((q,i)=>qHtml(q,i+1,false,'mock')).join('')}<div class=end>END OF PAPER · TOTAL FOR PAPER IS ${tot} MARKS</div></div>`;
const got=L.reduce((a,q)=>a+(+mock.s[q.id]||0),0);const p=got/tot*100;const gr=p>=90?'9':p>=78?'8':p>=66?'7':p>=55?'6':p>=45?'5':'below 5';
return `<div class=bar><b>Mark scheme</b> Enter the marks you gave yourself.</div>${L.map((q,i)=>qHtml(q,i+1,false,'mock').slice(0,-12)+'<div class=sol style="display:block"><b>Mark scheme</b><br>'+fmt(q.sol)+'<br><b>Answer:</b> '+fmt(q.ans)+'</div></div></div>'+`<div class=self>Your marks: <input type=number min=0 max=${q.m} value="${mock.s[q.id]||0}" onchange="mock.s['${q.id}']=Math.min(${q.m},Math.max(0,+this.value||0));render()"> / ${q.m}</div>`).join('')}<section class=card><h2>Score: ${got} / ${tot} (${Math.round(p)}%)</h2><p>Indicative grade: <b>${gr}</b>. This is a rough guide, not an official boundary. Look at the topics where you lost marks, then practise those by grade.</p><button class=pri onclick="mock=null;render()">Back</button></section>`}
function cover(tot){return `<div class=cover><div class=brandr>A<span>+</span> MATHS HUB</div><h1>International GCSE Mathematics A (4MA1)</h1><h2>Higher Tier · Mini Mock Paper</h2><div class=cand>Name ............................................... Class ..............</div><div class=info><b>Time:</b> 48 minutes &nbsp; <b>Total marks:</b> ${tot}</div><h3>Instructions</h3><ul><li>Use black or blue ink.</li><li>Answer all questions.</li><li>Write your answers in the spaces provided, on the dotted lines.</li><li>You must show all your working. Correct answers with no working may not get full marks.</li><li>A calculator may be used.</li></ul><h3>Information</h3><ul><li>The marks for each question are shown in brackets.</li><li>Use this as a guide to how much time to spend on each question.</li></ul><h3>Advice</h3><ul><li>Read each question carefully before you start to answer it.</li><li>Check your answers if you have time at the end.</li></ul></div>`}
function startMock(){mock={left:48*60,done:false,s:{}};clearInterval(window.__t);window.__t=setInterval(()=>{if(mock&&!mock.done&&--mock.left<=0){finishMock()}else if(tab==='mock'&&mock&&!mock.done)render()},1000);render()}
function finishMock(){clearInterval(window.__t);mock.done=true;render()}
function render(){$('#v').innerHTML=tab==='practice'?practice():tab==='lessons'?lessons():mockView()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tabs(b.dataset.t));render();</script></body></html>
