<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
  body { font-family: 'Inter', -apple-system, sans-serif; background: #F4F1EA; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 22px; color: #12182B; margin-bottom: 4px; }
  p { color: #666; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  input { width: 100%; max-width: 420px; padding: 12px 14px; font-size: 14px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 16px; box-sizing: border-box; }
  input:focus { outline: none; border-color: #F2A93B; }
  button { background: #F2A93B; color: #12182B; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:hover { opacity: 0.9; }
  #canvasWrap { margin-top: 24px; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: none; }
  #downloadBtn { margin-top: 14px; display: none; background: #3FBFAE; }
</style>
</head>
<body>
  <h1>Paste your published game link</h1>
  <p>Generates a scannable QR code your students can point their phone camera at.</p>
  <input id="urlInput" type="text" placeholder="https://claude.ai/public/artifacts/..." />
  <button onclick="generate()">Generate QR Code</button>
  <div id="canvasWrap"><canvas id="qrCanvas"></canvas></div>
  <button id="downloadBtn" onclick="download()">Download PNG</button>

<script>
  let qr;
  function generate() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    qr = new QRious({
      element: document.getElementById('qrCanvas'),
      value: url,
      size: 280,
      background: '#ffffff',
      foreground: '#12182B',
      level: 'M'
    });
    document.getElementById('canvasWrap').style.display = 'block';
    document.getElementById('downloadBtn').style.display = 'inline-block';
  }
  function download() {
    const link = document.createElement('a');
    link.download = 'game-qr-code.png';
    link.href = document.getElementById('qrCanvas').toDataURL('image/png');
    link.click();
  }
  document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
</script>
</body>
</html>
